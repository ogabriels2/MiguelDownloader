name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.424

      - name: Validate tag and project version
        id: version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:REF_NAME.TrimStart('v')
          $props = [xml](Get-Content -Raw Directory.Build.props)
          $projectVersion = [string]($props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag $env:REF_NAME is not a stable three-part version."
          }
          if ($tagVersion -ne $projectVersion) {
            throw "Tag version $tagVersion does not match Directory.Build.props version $projectVersion."
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Restore locked dependencies
        run: dotnet restore MiguelDownloader.sln --locked-mode

      - name: Restore previous release for delta generation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          dotnet tool restore
          $repoUrl = "https://github.com/$env:REPOSITORY"
          $latest = gh release list --repo $env:REPOSITORY --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          if ($latest) {
            dotnet vpk download github --repoUrl $repoUrl --token $env:GH_TOKEN --outputDir artifacts/releases --channel win
          }

      - name: Build release packages
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          pwsh build/publish.ps1
          -Version $env:PACKAGE_VERSION
          -Runtime win-x64

      - name: Collect current release subjects
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/current | Out-Null
          Get-Content artifacts/checksums.txt | ForEach-Object {
            $name = ($_ -split '\s{2,}', 2)[1]
            Copy-Item -LiteralPath (Join-Path artifacts/releases $name) -Destination artifacts/current
          }
          Copy-Item -LiteralPath artifacts/checksums.txt -Destination artifacts/current

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/current/*

      - name: Keep a workflow copy of the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MiguelDownloader-${{ steps.version.outputs.version }}
          path: artifacts/current/*
          if-no-files-found: error
          retention-days: 14

      - name: Create draft release and upload Velopack feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $repoUrl = "https://github.com/$env:REPOSITORY"
          dotnet vpk upload github `
            --repoUrl $repoUrl `
            --token $env:GH_TOKEN `
            --outputDir artifacts/releases `
            --channel win `
            --tag $env:RELEASE_TAG `
            --releaseName "Miguel Downloader $env:RELEASE_VERSION" `
            --targetCommitish $env:COMMIT_SHA
          gh release upload $env:RELEASE_TAG artifacts/checksums.txt --clobber
          gh release edit $env:RELEASE_TAG `
            --notes-file docs/release-notes.md `
            --draft=false `
            --latest
